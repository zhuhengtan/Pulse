name: Desktop packages
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: windows-2022
            arch: x64
          - os: ubuntu-24.04
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PULSE_DESKTOP_SMOKE_ARTIFACTS: artifacts/desktop-smoke
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Electron for the runner architecture
        working-directory: packages/desktop
        run: node node_modules/electron/install.js
      - name: Prepare Linux desktop sandbox
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: pnpm native:prepare
      - run: pnpm desktop:build
        env:
          PULSE_DESKTOP_CARGO_TARGET_DIR: ${{ runner.temp }}/pulse-desktop-cargo
      - run: pnpm desktop:app:prepare
      - name: Verify runtime pruning and dependency resolution
        run: pnpm exec vitest run tests/desktop-runtime-optimization.test.ts
      - name: Verify bundled runtime document and terminal features
        run: node scripts/desktop/runtime-smoke.mjs
      - name: Verify storage and chat protocol
        run: pnpm exec vitest run tests/conversation-data.test.ts tests/data-migration.test.ts tests/chat-websocket.test.ts
      - name: Load maintained desktop acceptance script
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.ref || '', 'refs/tags/shell-v')
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-controller
          sparse-checkout: scripts/desktop/smoke.mjs
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Use maintained desktop acceptance script without changing release packages
        if: github.event_name == 'workflow_dispatch' && startsWith(inputs.ref || '', 'refs/tags/shell-v')
        shell: bash
        env:
          ACCEPTANCE_SHA: ${{ github.sha }}
          TAGGED_REF: ${{ inputs.ref }}
        run: |
          case "$ACCEPTANCE_SHA" in
            *[!0-9a-f]*|'') echo "ACCEPTANCE_SHA_NOT_EXACT" >&2; exit 1 ;;
          esac
          test "${#ACCEPTANCE_SHA}" -eq 40
          test "$(git -C .release-controller rev-parse HEAD)" = "$ACCEPTANCE_SHA"
          tagged_head="$(git rev-parse "$TAGGED_REF^{commit}")"
          test "$(git rev-parse HEAD)" = "$tagged_head"
          cp .release-controller/scripts/desktop/smoke.mjs scripts/desktop/smoke.mjs
          test "$(git rev-parse HEAD)" = "$tagged_head"
          git diff --exit-code -- packages
      - name: Native desktop chat smoke
        if: runner.os != 'Linux'
        run: pnpm desktop:app:smoke
      - name: Native desktop startup smoke
        if: runner.os != 'Linux'
        run: pnpm desktop:app:startup-smoke
      - name: Native desktop installation smoke
        if: runner.os != 'Linux'
        run: pnpm desktop:app:install-smoke
      - name: Native Linux desktop chat smoke
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm desktop:app:smoke
      - name: Native Linux desktop startup smoke
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm desktop:app:startup-smoke
      - name: Native Linux desktop installation smoke
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm desktop:app:install-smoke
      - name: Build native packages
        run: pnpm --filter @hunterzhu/pulse-desktop run dist --${{ matrix.arch }} --publish never
      - name: Verify Windows installer process detection
        if: runner.os == 'Windows'
        run: node scripts/desktop/verify-windows-process-check.mjs
      - name: Verify final Windows NSIS installation, startup, reopen and repair
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/desktop/verify-windows-installer.ps1
      - name: Verify final Mac app signatures and runtime manifests
        if: runner.os == 'macOS'
        run: node scripts/desktop/verify-mac-artifacts.mjs
      - name: Native packaged Mac installation smoke
        if: runner.os == 'macOS'
        run: pnpm desktop:app:install-smoke
        env:
          PULSE_DESKTOP_EXECUTABLE: ${{ github.workspace }}/artifacts/desktop/mac-arm64/Pulse.app/Contents/MacOS/Pulse
      - name: Preserve desktop failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-diagnostics-${{ matrix.os }}-${{ matrix.arch }}
          path: artifacts/desktop-smoke/
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: pulse-desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            artifacts/desktop/*.dmg
            artifacts/desktop/*.zip
            artifacts/desktop/*.exe
            artifacts/desktop/*.AppImage
            artifacts/desktop/*.deb
          retention-days: 1
          if-no-files-found: error
