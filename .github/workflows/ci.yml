name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - name: Allow pnpm toolchain in shell sandbox
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'PNPM_HOME=' + require('node:path').join(require('node:os').homedir(), 'setup-pnpm') + require('node:os').EOL)"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Linux shell sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep socat
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install Windows shell sandbox
        if: runner.os == 'Windows'
        run: pnpm --filter @hunterzhu/pulse-adapters exec srt windows-install
      - run: pnpm check
      - name: Validate agent evaluation task set
        run: pnpm eval:validate
      - run: pnpm cli:build
      - name: Test CLI install bootstrap
        run: |
          node packages/cli/scripts/postinstall.mjs
          pnpm --filter @hunterzhu/pulse-cli exec pulse --version
          pnpm --filter @hunterzhu/pulse-cli exec pulse doctor --format json
        env:
          PULSE_HOME: ${{ runner.temp }}/pulse-user
      - run: pnpm cli:pack
      - run: pnpm cli:verify-package
      - name: Test Windows archive install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PULSE_HOME: ${{ runner.temp }}/pulse-archive-user
        run: |
          $archive = Get-ChildItem artifacts/cli/pulse-*.tar.gz | Select-Object -First 1
          New-Item -ItemType Directory -Force "$env:PULSE_HOME/data" | Out-Null
          Set-Content "$env:PULSE_HOME/data/keep.txt" 'preserve me'
          node scripts/cli/install.mjs --archive $archive.FullName
          & "$env:PULSE_HOME/bin/pulse.cmd" --version
          node scripts/cli/uninstall.mjs
          if (Test-Path "$env:PULSE_HOME/bin/pulse.cmd") { throw 'Pulse launcher was not removed' }
          if ((Get-Content "$env:PULSE_HOME/data/keep.txt" -Raw).Trim() -ne 'preserve me') { throw 'User data was not preserved' }
          $archiveRoot = Join-Path $env:RUNNER_TEMP 'pulse-archive-extracted'
          New-Item -ItemType Directory -Force $archiveRoot | Out-Null
          tar -xzf $archive.FullName -C $archiveRoot
          pwsh -NoProfile -ExecutionPolicy Bypass -File "$archiveRoot/pulse/install.ps1"
          & "$env:PULSE_HOME/bin/pulse.cmd" --version
          pwsh -NoProfile -ExecutionPolicy Bypass -File "$archiveRoot/pulse/uninstall.ps1"
          if (Test-Path "$env:PULSE_HOME/bin/pulse.cmd") { throw 'PowerShell installer launcher was not removed' }
          if ((Get-Content "$env:PULSE_HOME/data/keep.txt" -Raw).Trim() -ne 'preserve me') { throw 'PowerShell installer did not preserve user data' }
      - run: pnpm cli:start -- --version
      - run: pnpm cli:dev -- --version
      - run: pnpm cli:debug -- --version
        env:
          PULSE_INSPECTOR: 127.0.0.1:0
      - name: Remove Windows shell sandbox
        if: always() && runner.os == 'Windows'
        run: pnpm --filter @hunterzhu/pulse-adapters exec srt windows-uninstall
