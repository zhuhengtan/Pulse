name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PULSE_EXPECTED_PNPM_VERSION: 12.4.2
    steps:
      - uses: actions/checkout@v4
      - name: Use runner workspace for Windows temporary files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PULSE_EXPECTED_PNPM_VERSION }}
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Verify pnpm installation
        run: |
          node scripts/ci/verify-pnpm.mjs
          pnpm --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Linux shell sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep socat
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install Windows shell sandbox
        id: windows-sandbox
        if: runner.os == 'Windows'
        run: pnpm --filter @hunterzhu/pulse-adapters exec srt windows-install
      - name: Verify Windows sandbox toolchain
        if: runner.os == 'Windows'
        timeout-minutes: 4
        run: pnpm exec vitest run tests/m3-context-adapters.test.ts -t "runs the installed development toolchain" --reporter verbose
      - name: Run shared local and cloud checks
        timeout-minutes: 15
        run: pnpm ci:local
      - name: Remove Windows shell sandbox
        if: always() && runner.os == 'Windows' && steps.windows-sandbox.outcome == 'success'
        run: pnpm --filter @hunterzhu/pulse-adapters exec srt windows-uninstall
