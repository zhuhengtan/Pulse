name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PULSE_EXPECTED_PNPM_VERSION: 12.4.2
    steps:
      - uses: actions/checkout@v4
      - name: Use runner workspace for Windows temporary files
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "TEMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$env:RUNNER_TEMP" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PULSE_EXPECTED_PNPM_VERSION }}
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Verify pnpm installation
        run: |
          node scripts/ci/verify-pnpm.mjs
          pnpm --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm desktop:build
      - name: Install Linux shell sandbox dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep socat
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Install Windows shell sandbox
        id: windows-sandbox
        if: runner.os == 'Windows'
        run: pnpm --filter @hunterzhu/pulse-adapters exec srt windows-install
      - name: Verify Windows paths, transfer, and shutdown
        if: runner.os == 'Windows'
        timeout-minutes: 12
        run: |
          pnpm exec tsc -b --pretty false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec vitest run tests/h5-workspaces.test.ts tests/windows-path-portability.test.ts tests/atomic-state-file.test.ts tests/conversation-manifest-atomic.test.ts tests/host-filesystem.test.ts tests/check-inventory.test.ts tests/conversation-bundle.test.ts tests/assistant-approval-http.test.ts tests/h5-work-notifications.test.ts tests/h5-shutdown.test.ts tests/self-host-snapshot.test.ts tests/h5-workspace-candidate.test.ts tests/self-host-main.test.ts tests/self-host-process.test.ts tests/copy-evidence.test.ts tests/git-diff.test.ts tests/windows-shell-environment.test.ts tests/runtime-persistence-sharing.test.ts tests/review-regressions.test.ts --reporter verbose
      - name: Verify Windows sandbox toolchain
        if: runner.os == 'Windows'
        timeout-minutes: 18
        env:
          SRT_DEBUG: '1'
          PULSE_SANDBOX_TIMING: '1'
        run: pnpm exec vitest run tests/m3-context-adapters.test.ts -t "runs the installed development toolchain" --reporter verbose
      - name: Verify Windows dependency access
        if: runner.os == 'Windows'
        timeout-minutes: 8
        env:
          SRT_DEBUG: '1'
          PULSE_SANDBOX_TIMING: '1'
        run: pnpm exec vitest run tests/lt02-four-issues-repair.test.ts tests/windows-acl-batches.test.ts -t "loads shared installed aliases|cleans up every native ACL batch" --reporter verbose
      - name: Verify Windows Python behavior probes
        if: runner.os == 'Windows'
        timeout-minutes: 7
        run: |
          pnpm exec tsc -b --pretty false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec vitest run tests/eval-grader.test.ts -t "executes valid Python behavior probes" --reporter verbose
      - name: Verify Windows candidate test runner
        if: runner.os == 'Windows'
        timeout-minutes: 12
        run: |
          pnpm exec vitest run tests/candidate-test-script.test.ts -t "runs a corrected new test script|revalidates the corrected entrypoint" --reporter verbose
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm exec vitest run tests/shell-pnpm-exec.test.ts --reporter verbose
      - name: Run shared local and cloud checks
        # Windows runs serially because SRT owns machine-wide ACL state; each
        # real tool launch includes its cold permission setup and cleanup.
        timeout-minutes: ${{ runner.os == 'Windows' && 120 || runner.os == 'macOS' && 30 || 15 }}
        run: pnpm ci:local
      - name: Remove Windows shell sandbox
        if: always() && runner.os == 'Windows' && steps.windows-sandbox.outcome == 'success'
        run: pnpm --filter @hunterzhu/pulse-adapters exec srt windows-uninstall
