name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  verify-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Require successful CI for this exact commit
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'ci.yml', head_sha: sha, event: 'push', per_page: 100
            });
            const latest = runs.filter(run => run.head_sha === sha && run.head_branch === 'main')
              .sort((a, b) => b.id - a.id)[0];
            if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
              throw new Error(`Release blocked: latest main CI for ${sha} is not successful.`);
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: latest.id, filter: 'latest', per_page: 100
            });
            for (const os of ['ubuntu-latest', 'macos-latest', 'windows-latest']) {
              const job = jobs.find(job => job.name === `check (${os})`);
              if (!job || job.status !== 'completed' || job.conclusion !== 'success') {
                throw new Error(`Release blocked: ${os} has not passed for ${sha}.`);
              }
            }
            core.info(`Release approved by CI run ${latest.id} for ${sha}`);
  client:
    needs: verify-ci
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  desktop:
    needs: verify-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, arch: x64, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, arch: x64, target: x86_64-pc-windows-msvc }
          - { os: macos-latest, arch: arm64, target: aarch64-apple-darwin }
          - { os: macos-latest, arch: x64, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: node scripts/automation/build-desktop.mjs
        env:
          PULSE_DESKTOP_ARCH: ${{ matrix.arch }}
          PULSE_DESKTOP_TARGET: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: packages/server/native/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-sandbox
          path: packages/adapters/dist/native/
          if-no-files-found: error
  release:
    needs: [verify-ci, desktop, client]
    runs-on: ubuntu-latest
    env:
      PULSE_EXPECTED_PNPM_VERSION: 12.4.2
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      PULSE_VERIFY_WINDOWS_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Require successful CI for this exact commit
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'ci.yml', head_sha: sha, event: 'push', per_page: 100
            });
            const latest = runs.filter(run => run.head_sha === sha && run.head_branch === 'main')
              .sort((a, b) => b.id - a.id)[0];
            if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
              throw new Error(`Release blocked: latest main CI for ${sha} is not successful.`);
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: latest.id, filter: 'latest', per_page: 100
            });
            for (const os of ['ubuntu-latest', 'macos-latest', 'windows-latest']) {
              const job = jobs.find(job => job.name === `check (${os})`);
              if (!job || job.status !== 'completed' || job.conclusion !== 'success') {
                throw new Error(`Release blocked: ${os} has not passed for ${sha}.`);
              }
            }
            core.info(`Release approved by CI run ${latest.id} for ${sha}`);
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PULSE_EXPECTED_PNPM_VERSION }}
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Verify pnpm installation
        run: |
          node scripts/ci/verify-pnpm.mjs
          pnpm --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Enable npm trusted publishing
        run: npm install --global npm@11.15.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Linux shell sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep socat
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: packages/server/native
          merge-multiple: true
      - run: chmod +x packages/server/native/*/pulse-desktop-helper packages/server/native/darwin-*/Pulse\ Desktop\ Helper.app/Contents/MacOS/PulseDesktopHelper
      - uses: actions/download-artifact@v4
        with:
          name: windows-sandbox
          path: packages/adapters/dist/native
      - run: pnpm native:prepare
      - run: pnpm check
      - run: pnpm release:check
      - run: pnpm cli:build
      - run: pnpm cli:pack
      - run: pnpm cli:verify-package
      - uses: actions/download-artifact@v4
        with:
          pattern: pulse-desktop-*
          path: artifacts/desktop
          merge-multiple: true
      - name: Verify all desktop assets and generate checksums
        run: node scripts/release/verify-desktop-assets.mjs
      - run: pnpm release:npm-publish
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" artifacts/cli/pulse-*.tar.gz artifacts/cli/*.sha256 artifacts/desktop/*.dmg artifacts/desktop/*.zip artifacts/desktop/*.exe artifacts/desktop/*.AppImage artifacts/desktop/*.deb artifacts/desktop/pulse-desktop-SHA256SUMS.txt --generate-notes --verify-tag --draft
          gh release edit "$RELEASE_TAG" --draft=false --latest
