name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  actions: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PULSE_EXPECTED_PNPM_VERSION: 12.4.2
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Require successful CI for this exact commit
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const sha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'ci.yml', head_sha: sha, event: 'push', per_page: 100
            });
            const latest = runs.filter(run => run.head_sha === sha && run.head_branch === 'main')
              .sort((a, b) => b.id - a.id)[0];
            if (!latest || latest.status !== 'completed' || latest.conclusion !== 'success') {
              throw new Error(`Release blocked: latest main CI for ${sha} is not successful.`);
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: latest.id, filter: 'latest', per_page: 100
            });
            for (const os of ['ubuntu-latest', 'macos-latest', 'windows-latest']) {
              const job = jobs.find(job => job.name === `check (${os})`);
              if (!job || job.status !== 'completed' || job.conclusion !== 'success') {
                throw new Error(`Release blocked: ${os} has not passed for ${sha}.`);
              }
            }
            core.info(`Release approved by CI run ${latest.id} for ${sha}`);
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PULSE_EXPECTED_PNPM_VERSION }}
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Verify pnpm installation
        run: |
          node scripts/ci/verify-pnpm.mjs
          pnpm --version
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Enable npm trusted publishing
        run: npm install --global npm@11.15.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Install Linux shell sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep socat
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - run: pnpm check
      - run: pnpm release:check
      - run: pnpm cli:build
      - run: pnpm cli:pack
      - run: pnpm cli:verify-package
      - run: pnpm release:npm-publish
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" artifacts/cli/pulse-*.tar.gz artifacts/cli/*.sha256 --generate-notes --verify-tag
